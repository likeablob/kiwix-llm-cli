[project]
name = "kiwix-llm-cli"
version = "0.2.0"
description = "Kiwix ZIM file search CLI for LLM coding agents"
readme = "README.md"
authors = [
    { name = "likeablob", email = "46628917+likeablob@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.0",
    "httpx>=0.28.1",
    "libzim>=3.9.0",
    "markdownify>=1.2.2",
    "platformdirs>=4.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=15.0.0",
    "tqdm>=4.0.0",
]

[project.urls]
Documentation = "https://github.com/likeablob/kiwix-llm-cli"
Source = "https://github.com/likeablob/kiwix-llm-cli"

[project.scripts]
kwxlc = "kiwix_llm_cli.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]
